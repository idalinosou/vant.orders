server:
  port: ${PORT:8080}

spring:
  application:
    name: vant-orders
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:h2:mem:orders;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration/h2
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  internal:
    token: ${INTERNAL_TOKEN:dev-internal-token}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200,http://localhost:8081}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    rabbit:
      enabled: false
