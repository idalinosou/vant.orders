services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: vant-orders-sqlserver
    profiles: [sqlserver]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Vant@Passw0rd}
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    volumes:
      - sqlserver-data:/var/opt/mssql

  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: vant-orders-sqlserver-init
    profiles: [sqlserver]
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Vant@Passw0rd}
    depends_on:
      sqlserver:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >
        /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" -C
        -Q "IF DB_ID('orders') IS NULL CREATE DATABASE orders"

  backend:
    environment:
      SPRING_PROFILES_ACTIVE: rabbit,sqlserver
      DB_HOST: sqlserver
      DB_PORT: "1433"
      DB_NAME: orders
      DB_USER: sa
      DB_PASSWORD: ${MSSQL_SA_PASSWORD:-Vant@Passw0rd}
    depends_on:
      rabbitmq:
        condition: service_healthy
      sqlserver:
        condition: service_healthy
      sqlserver-init:
        condition: service_completed_successfully

volumes:
  sqlserver-data:
