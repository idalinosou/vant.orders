name: vant-orders

services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: vant-orders-rabbit
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER:-vant}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD:-vant}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - rabbit-data:/var/lib/rabbitmq

  backend:
    build:
      context: ./backend
    container_name: vant-orders-api
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-rabbit}
      RABBIT_HOST: rabbitmq
      RABBIT_PORT: "5672"
      RABBIT_USER: ${RABBIT_USER:-vant}
      RABBIT_PASSWORD: ${RABBIT_PASSWORD:-vant}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-dev-internal-token}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200,http://localhost:8081}
      DB_URL: ${DB_URL:-jdbc:h2:mem:orders;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    ports:
      - "8080:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  worker:
    build:
      context: ./worker
    container_name: vant-orders-worker
    environment:
      RABBIT_URL: amqp://${RABBIT_USER:-vant}:${RABBIT_PASSWORD:-vant}@rabbitmq:5672
      API_URL: http://backend:8080
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-dev-internal-token}
    depends_on:
      rabbitmq:
        condition: service_healthy
      backend:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: vant-orders-web
    ports:
      - "8081:80"
    depends_on:
      backend:
        condition: service_started

volumes:
  rabbit-data:
